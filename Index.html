<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Film Library </title>  <!---Bu page nomi tab tepasida turadi -->
    <link rel="stylesheet" href="Style.css">

    <!---Bootstrap ulavoman CSSi o'rniga-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<!--Bu main parti-->
<body>


    <header>
        <nav class="navbar bg-primary"  data-bs-theme="light">
        <!-- Navbar content -->
            <div class="container-fluid">
                <h2 class="navbar-brand">Film library</h2>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-info" type="submit">Search</button>
                    <span> 👤</span>
                </form>
            </div>
        </nav>
    </header>

    <main>
  
    <div class="row justify-content-md-center" p-3>
        <!--- Chap tomoni -->
        <div class="col-md-2 bg-light min-vh-100 p-3">
            <h5 class="mb-3">Filters</h5>
            <div class="d-grid gap-2">
                <button class="btn btn-outline-primary border-light text-start">All</button>
                <button class="btn btn-outline-primary  border-light text-start">Favorites</button>
                <button class="btn btn-outline-primary border-light text-start">Best Rated</button>
                <button class="btn btn-outline-primary border-light text-start">Seen Last Month</button>
                <button class="btn btn-outline-primary border-light text-start">Unseen</button>
            </div>
        </div>
        <!-- Chap tomoni tugadi -->

        <!-- O'ng tomoni -->
        <div class="col-10">    
            <section>
                <h1>All films</h1>
                <div  class="row justify-content-md-center" p-3>
                    <div class="col-4"> 
                        <span>❤️</span>
                        <span>Pulp Fiction</span>
                    </div>
                    <div class="col-6"> 
                        <span>March 10, 2026</span>
                    </div>
                    <div class="col-2"> 
                        <span>⭐⭐⭐⭐☆</span>
                        <button type="button" class="btn btn-outline-info mary border-light text-start">🖊</button>
                        <button type="button" class="btn btn-outline-danger border-light text-start">🗑</button>
                    </div>
                </div>

            </section>
        </div>
        <!-- O'ng tomoni tugadi  -->           
    </div>
    <!-- Add a new film... -->
   <button type="button" class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4">
        +
    </button>
    
    

    

    </main>

    
    

</body>
</html>
